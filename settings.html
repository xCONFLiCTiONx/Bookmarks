<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Extension Settings</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f5;
      --text: #1f1f1f;
      --muted: #666;
      --panel: #ffffff;
      --border: #e0e0e0;
      --input-bg: #ffffff;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1e1e1e;
      --text: #e0e0e0;
      --muted: #aaa;
      --panel: #2a2a2a;
      --border: #333;
      --input-bg: #2a2a2a;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      color: var(--text);
    }

    .section {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    select, input[type="checkbox"] {
      margin-top: 6px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .toolbar-item {
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <h1>Extension Settings</h1>

  <div class="section">
    <h2>Popup Root Folder</h2>
    <label>Select which bookmark folder the popup should display:</label>
    <select id="popupRootFolder"></select>
  </div>

  <div class="section">
    <h2>Theme</h2>
    <label>Select the appearance for the extension:</label>
    <select id="themeSelect">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <script src="theme.js"></script>
  <script src="settings.js"></script>
</body>
</html>
