<!DOCTYPE html>
<html>
  <head>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f5;
        --text: #1f1f1f;
        --panel: #ffffff;
        --panel-alt: #f0f0f0;
        --border: #e0e0e0;
        --muted: #666;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1e1e1e;
        --text: #e0e0e0;
        --panel: #2a2a2a;
        --panel-alt: #333;
        --border: #333;
        --muted: #aaa;
      }

      body { 
        width: 400px; 
        font-family: sans-serif; 
        margin: 0; 
        background-color: var(--bg); 
        color: var(--text); 
      }
      
      #bookmarkList { 
        max-height: 450px;
        overflow-y: auto; 
        scrollbar-width: none; 
        -ms-overflow-style: none; 
      }
      #bookmarkList::-webkit-scrollbar { 
        display: none; 
      }

      #nav-row { 
        padding: 6px 8px; 
        background-color: var(--panel); 
        border-bottom: 2px solid var(--border); 
        font-size: 12px;
        display: flex;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
        box-sizing: border-box;
        height: 33px;
      }

      #path-container {
        flex-grow: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #footer-row {
        background-color: var(--panel);
        border-top: 2px solid var(--border);
        padding: 0 8px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        box-sizing: border-box;
        height: 33px;
      }

      .footer-btn {
        background: transparent; 
        color: var(--muted); 
        border: none; 
        padding: 4px; 
        cursor: pointer; 
        border-radius: 4px; 
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin-left: 4px;
      }
      .footer-btn:hover { 
        background: var(--panel-alt); 
        color: var(--text); 
      }

      #footer-row .footer-btn {
        background: transparent;
        color: var(--muted);
      }
      #footer-row .footer-btn:hover {
        background: var(--panel-alt);
        color: var(--text);
      }

      ul { list-style: none; padding: 0; margin: 0; }
      li { 
        padding: 9px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; 
      }
      li:hover { background-color: var(--panel-alt); }
      
      .folder-icon { 
        width: 18px; height: 13px; background-color: #fbc02d; border-radius: 2px; margin-right: 10px; display: inline-block; flex-shrink: 0; 
      }
    </style>
  </head>
  <body>
    <div id="nav-row">
      <div id="path-container"></div>
    </div>
    <ul id="bookmarkList"></ul>
    <div id="footer-row"></div>
    <script src="theme.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
