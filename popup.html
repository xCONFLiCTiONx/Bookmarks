<!DOCTYPE html>
<html>
  <head>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f5;
        --text: #1f1f1f;
        --panel: #ffffff;
        --panel-alt: #f0f0f0;
        --border: #e0e0e0;
        --muted: #666;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1e1e1e;
        --text: #e0e0e0;
        --panel: #2a2a2a;
        --panel-alt: #333;
        --border: #333;
        --muted: #aaa;
      }

      body { 
        width: 400px; 
        font-family: sans-serif; 
        margin: 0; 
        background-color: var(--bg); 
        color: var(--text); 
      }
      
      #bookmarkList { 
        max-height: 450px;
        overflow-y: auto; 
        scrollbar-width: none; 
        -ms-overflow-style: none; 
      }
      #bookmarkList::-webkit-scrollbar { 
        display: none; 
      }

      #nav-row { 
        padding: 6px 8px; 
        background-color: var(--panel); 
        border-bottom: 2px solid var(--border); 
        font-size: 12px;
        display: flex;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
        box-sizing: border-box;
        height: 33px;
      }

      #path-container {
        flex-grow: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-button {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        padding: 0;
      }

      .nav-button:hover {
        background: var(--panel-alt);
        color: var(--text);
      }

      .navigation-menu {
        position: absolute;
        top: 38px;
        right: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
        min-width: 210px;
        display: none;
        z-index: 20;
        overflow: hidden;
      }

      .navigation-menu.active {
        display: block;
      }

      .navigation-menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
        transition: background 0.2s;
      }

      .navigation-menu-item:hover {
        background: var(--panel-alt);
      }

      .navigation-menu-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      ul { list-style: none; padding: 0; margin: 0; }
      li { 
        padding: 9px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; 
      }
      li:hover { background-color: var(--panel-alt); }
      
      .folder-icon { 
        width: 18px; height: 13px; background-color: #fbc02d; border-radius: 2px; margin-right: 10px; display: inline-block; flex-shrink: 0; 
      }
    </style>
  </head>
  <body>
    <div id="nav-row">
      <div id="path-container"></div>
      <button id="navBtn" class="nav-button" title="Navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
      <div id="nav-menu" class="navigation-menu"></div>
    </div>
    <ul id="bookmarkList"></ul>
    <script src="theme.js"></script>
    <script src="navigation.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
